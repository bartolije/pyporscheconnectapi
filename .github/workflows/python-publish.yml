# Uploads the package to PyPI when a release is published.
# Uses trusted publishing (OIDC) — no PyPI password stored in repo secrets.

name: Upload Python Package

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Waits for the maintainer's approval: nothing reaches PyPI by accident.
    environment: release
    permissions:
      contents: read
      id-token: write  # for PyPI trusted publishing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install build and test deps
        run: |
          python -m pip install --upgrade pip
          pip install build twine -r requirements_dev.txt -e ".[cli]"
      - name: Check the release tag matches the package version
        run: |
          version="$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")"
          test "$version" = "${GITHUB_REF_NAME#v}"
      - name: Check types and run the tests
        run: |
          mypy
          pytest tests/ -q
      - name: Build distributions
        run: |
          python -m build
          twine check --strict dist/*
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          # A release cut for an already-published version is a no-op instead
          # of a hard failure (e.g. when a version was uploaded manually).
          skip-existing: true
