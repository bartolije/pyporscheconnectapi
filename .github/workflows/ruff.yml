name: Ruff
on:
  push:
    branches: [main]
  pull_request:
# Read-only token: these jobs only check out the code.
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0
        with:
          # Pinned to the local dev toolchain: an unpinned action pulls the
          # newest ruff, whose freshly-stabilised rules break CI out of the
          # blue (select ALL). Bump together with requirements_dev.txt and
          # .pre-commit-config.yaml.
          version: 0.15.15
      - name: Check formatting
        run: ruff format --check
